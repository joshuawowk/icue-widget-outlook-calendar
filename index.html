<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('Outlook Calendar')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />

  <meta name="x-icue-restrictions" data-restrictions='[{ "device": "dashboard_lcd" }]' />
  <meta name="x-icue-widget-group" content="tr('Productivity')" />

  <script type="text/javascript" src="../common/tools/media_viewer/MediaViewer.js"></script>
  <link rel="stylesheet" type="text/css" href="../common/tools/media_viewer/MediaViewer.css" />

  <!-- Feature properties -->
  <meta name="x-icue-property" content="proxyUrl" data-label="tr('Proxy URL (xeneon-graph-proxy)')" data-type="textfield" data-default="'http://192.168.0.160:8585'" />
  <meta name="x-icue-property" content="daysAhead" data-label="tr('Days Ahead')" data-type="slider" data-default="5" data-min="1" data-max="14" data-step="1" />
  <meta name="x-icue-property" content="hideAllDay" data-label="tr('Hide All-Day Events')" data-type="switch" data-default="false" />
  <meta name="x-icue-property" content="refreshMinutes" data-label="tr('Refresh Interval')" data-type="slider" data-default="5" data-min="1" data-max="30" data-step="1" data-unit-label="'min'" />

  <!-- Widget Personalization -->
  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#ffffff'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#3b82f6'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#15161c'" />
  <meta name="x-icue-property" content="backgroundMedia" data-label="tr('Background Image')" data-type="media-selector" data-filters="['*.png','*.jpg','*.jpeg','*.webp']" />
  <meta name="x-icue-property" content="glassBlur" data-label="tr('Glass Blur')" data-type="slider" data-default="0" data-min="0" data-max="30" data-step="1" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('Outlook Calendar')", "properties": ["proxyUrl", "daysAhead", "hideAllDay", "refreshMinutes"] },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "backgroundMedia", "glassBlur", "transparency"] }
  ]
  </script>

  <link rel="stylesheet" type="text/css" href="styles/OutlookCalendar.css" />
</head>
<body>
  <div class="widget-root">
    <div class="widget-background" aria-hidden="true">
      <div class="main-glass"></div>
      <div id="media-background"></div>
    </div>

    <div class="main-content">
      <div class="loading-state state-panel">
        <div class="spinner"></div>
        <div class="state-text">Loading calendar…</div>
      </div>

      <div class="error-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22L12 2zm0 6c.6 0 1 .4 1 1v5a1 1 0 0 1-2 0V9c0-.6.4-1 1-1zm0 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
        <div class="state-text error-text">Unable to load calendar</div>
        <div class="state-sub error-detail"></div>
      </div>

      <div class="auth-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>
        <div class="state-text">Waiting for calendar data</div>
        <div class="state-sub">The proxy has no Outlook data yet.<br>Run the Outlook sync or sign in on the proxy.</div>
      </div>

      <div class="empty-state state-panel" style="display:none;">
        <svg class="state-icon ok" viewBox="0 0 24 24"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM9.4 17l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L15.4 11l-6 6z"/></svg>
        <div class="state-text">Nothing scheduled</div>
        <div class="state-sub">Your calendar is clear</div>
      </div>

      <div class="content" style="display:none;">
        <header class="topbar">
          <div class="topbar-left">
            <div class="title-row">
              <span class="day-number" id="todayNum">10</span>
              <div class="title-stack">
                <span class="widget-title" id="todayDow">Wednesday</span>
                <span class="subtitle" id="todayMonth">June</span>
              </div>
            </div>
          </div>
          <div class="topbar-right">
            <div class="next-label">next</div>
            <div class="next-countdown hero-value" id="nextIn">—</div>
          </div>
        </header>
        <div class="event-list" id="eventList"></div>
      </div>
    </div>
  </div>

  <script>
    icueEvents = {
      'onDataUpdated': onIcueDataUpdated,
      'onICUEInitialized': onIcueInitialized,
      'onUpdateRequested': onUpdateRequested
    };

    let languageCode = 'en';

    function getIcueProperty(name) {
      if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
        const value = window[name];
        if (value !== undefined && value !== null && value !== '') return value;
      }
      try {
        const value = Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
        if (value !== undefined && value !== null && value !== '') return value;
      } catch (e) {}
      return undefined;
    }

    function clampRange(v, min, max, d) {
      v = Number(v);
      if (!Number.isFinite(v)) return d;
      return Math.max(min, Math.min(max, v));
    }

    /* ---------- Media background ---------- */
    const mediaMount = document.getElementById('media-background');
    function createMediaBackgroundComponent(container) {
      if (!container) return { clear: function () {}, loadMedia: function () {} };
      if (typeof MediaViewer === 'function') {
        const viewer = new MediaViewer({
          container: container,
          onMediaLoaded: function () { container.classList.add('has-media'); },
          onMediaError: function (err) { container.classList.remove('has-media'); console.error(err); }
        });
        return {
          clear: function () { viewer.clear(); container.classList.remove('has-media'); },
          loadMedia: function (c) { viewer.loadMedia(c); }
        };
      }
      return {
        clear: function () { container.style.backgroundImage = ''; container.classList.remove('has-media'); },
        loadMedia: function (c) {
          const p = c && (c.path || c.pathToAsset);
          if (!p) { this.clear(); return; }
          container.style.backgroundImage = "url('" + p + "')";
          container.style.backgroundSize = 'cover';
          container.style.backgroundPosition = 'center';
          container.classList.add('has-media');
        }
      };
    }
    const mediaBackgroundComponent = createMediaBackgroundComponent(mediaMount);

    function applyStyles() {
      const root = document.documentElement;
      root.style.setProperty('--bg-opacity', clampRange(getIcueProperty('transparency'), 0, 100, 100) / 100);
      const tc = getIcueProperty('textColor');
      const ac = getIcueProperty('accentColor');
      const bgc = getIcueProperty('backgroundColor');
      root.style.setProperty('--text-color', (typeof tc === 'string' && tc) ? tc : '#ffffff');
      root.style.setProperty('--accent-color', (typeof ac === 'string' && ac) ? ac : '#3b82f6');
      root.style.setProperty('--bg-color', (typeof bgc === 'string' && bgc) ? bgc : '#15161c');
      root.style.setProperty('--bg-blur', clampRange(getIcueProperty('glassBlur'), 0, 30, 0) + 'px');
      const bgMedia = getIcueProperty('backgroundMedia');
      if (!bgMedia) { mediaBackgroundComponent.clear(); return; }
      mediaBackgroundComponent.loadMedia({
        path: bgMedia.pathToAsset,
        baseWidth: bgMedia.baseWidth,
        baseHeight: bgMedia.baseHeight,
        scale: bgMedia.scale, positionX: bgMedia.positionX,
        positionY: bgMedia.positionY, angle: bgMedia.angle
      });
    }

    function showState(state) {
      ['loading-state', 'error-state', 'auth-state', 'empty-state', 'content'].forEach(s => {
        const el = document.querySelector('.' + s);
        if (el) el.style.display = s === state ? '' : 'none';
      });
    }

    /* ---------- Data ---------- */
    let lastGoodEvents = null;
    let refreshTimer = null;
    let countdownTimer = null;
    let fetchInFlight = false;

    function proxyBase() {
      const u = (getIcueProperty('proxyUrl') || 'http://192.168.0.160:8585').toString().trim();
      return u.replace(/\/+$/, '');
    }

    async function loadEvents() {
      if (fetchInFlight) return;
      fetchInFlight = true;
      try {
        const days = clampRange(getIcueProperty('daysAhead'), 1, 14, 5);
        const res = await fetch(proxyBase() + '/api/calendar?days=' + days);
        if (res.status === 401) { showState('auth-state'); return; }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const events = await res.json();
        lastGoodEvents = events;
        renderEvents(events, false);
      } catch (e) {
        console.error('Calendar fetch failed:', e);
        if (lastGoodEvents) renderEvents(lastGoodEvents, true);
        else {
          showState('error-state');
          document.querySelector('.error-detail').textContent = 'Cannot reach proxy at ' + proxyBase();
        }
      } finally {
        fetchInFlight = false;
      }
    }

    function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

    function fmtTime(d) {
      return d.toLocaleTimeString(languageCode, { hour: 'numeric', minute: '2-digit' });
    }

    function dayLabel(d) {
      const today = startOfDay(new Date());
      const diff = Math.round((startOfDay(d) - today) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      return d.toLocaleDateString(languageCode, { month: 'short', day: 'numeric' }) +
             ' • ' + d.toLocaleDateString(languageCode, { weekday: 'long' }).toUpperCase();
    }

    function updateCountdown(events) {
      const el = document.getElementById('nextIn');
      const label = document.querySelector('.next-label');
      const now = new Date();
      const upcoming = (events || [])
        .filter(e => !e.isAllDay)
        .map(e => ({ ...e, startD: new Date(e.start) }))
        .filter(e => e.startD > now)
        .sort((a, b) => a.startD - b.startD)[0];
      const current = (events || [])
        .filter(e => !e.isAllDay)
        .map(e => ({ ...e, startD: new Date(e.start), endD: new Date(e.end) }))
        .find(e => e.startD <= now && e.endD > now);

      if (current) {
        label.textContent = 'now';
        el.textContent = 'busy';
        el.classList.add('busy');
        return;
      }
      el.classList.remove('busy');
      label.textContent = 'next';
      if (!upcoming) { el.textContent = '—'; return; }
      const mins = Math.round((upcoming.startD - now) / 60000);
      if (mins < 60) el.textContent = mins + 'm';
      else if (mins < 1440) el.textContent = Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + (mins % 60) + 'm' : '');
      else el.textContent = Math.round(mins / 1440) + 'd';
    }

    function renderEvents(events, offline) {
      const hideAllDay = getIcueProperty('hideAllDay') === true;
      const now = new Date();

      let shaped = (events || [])
        .map(e => ({ ...e, startD: new Date(e.start), endD: new Date(e.end) }))
        .filter(e => !isNaN(e.startD))
        .filter(e => e.isAllDay ? !hideAllDay : e.endD > now)
        .sort((a, b) => a.startD - b.startD);

      // header date
      const today = new Date();
      document.getElementById('todayNum').textContent = today.getDate();
      document.getElementById('todayDow').textContent =
        today.toLocaleDateString(languageCode, { weekday: 'long' }) + (offline ? ' • offline' : '');
      document.getElementById('todayMonth').textContent =
        today.toLocaleDateString(languageCode, { month: 'long', year: 'numeric' });

      updateCountdown(events);
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => updateCountdown(lastGoodEvents), 30000);

      if (shaped.length === 0) { showState('empty-state'); return; }

      const listEl = document.getElementById('eventList');
      listEl.innerHTML = '';
      let lastDayKey = '';

      shaped.forEach(e => {
        const dayKey = startOfDay(e.startD).toISOString();
        if (dayKey !== lastDayKey) {
          lastDayKey = dayKey;
          const sep = document.createElement('div');
          sep.className = 'day-separator';
          sep.textContent = dayLabel(e.startD);
          listEl.appendChild(sep);
        }

        const row = document.createElement('div');
        row.className = 'event-row' + (e.startD <= now && e.endD > now ? ' event-now' : '');

        const tile = document.createElement('div');
        tile.className = 'time-tile';
        if (e.isAllDay) {
          tile.innerHTML = '<span class="tile-hour">All</span><span class="tile-ampm">day</span>';
        } else {
          const h = e.startD.toLocaleTimeString(languageCode, { hour: 'numeric', hour12: true });
          const parts = h.match(/(\d+)\s*([AP]M)?/i) || [];
          tile.innerHTML = '<span class="tile-hour">' + (parts[1] || e.startD.getHours()) +
            '<sup class="tile-min">' + String(e.startD.getMinutes()).padStart(2, '0') + '</sup></span>' +
            '<span class="tile-ampm">' + (parts[2] || '') + '</span>';
        }

        const main = document.createElement('div');
        main.className = 'event-main';
        const title = document.createElement('div');
        title.className = 'event-title';
        title.textContent = e.subject;
        const meta = document.createElement('div');
        meta.className = 'event-meta';
        const range = document.createElement('span');
        range.className = 'event-time';
        range.textContent = e.isAllDay ? 'All day' : fmtTime(e.startD) + ' – ' + fmtTime(e.endD);
        meta.appendChild(range);
        if (e.location) {
          const loc = document.createElement('span');
          loc.className = 'event-loc';
          loc.textContent = e.location;
          meta.appendChild(loc);
        }
        main.appendChild(title);
        main.appendChild(meta);

        row.appendChild(tile);
        row.appendChild(main);
        listEl.appendChild(row);
      });

      showState('content');
    }

    /* ---------- Lifecycle ---------- */
    function scheduleRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      const mins = clampRange(getIcueProperty('refreshMinutes'), 1, 30, 5);
      refreshTimer = setInterval(loadEvents, mins * 60000);
    }

    function onUpdateRequested() { loadEvents(); }

    function onIcueDataUpdated() {
      applyStyles();
      scheduleRefresh();
      loadEvents();
    }

    function onIcueInitialized() {
      if (typeof iCUE !== 'undefined' && iCUE.iCUELanguage) languageCode = iCUE.iCUELanguage;
      onIcueDataUpdated();
    }

    if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
      onIcueInitialized();
    } else {
      onIcueDataUpdated();
    }
  </script>
</body>
</html>
